<!doctype html>
<html><head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>html,body,#map{height:100%;margin:0}.legend{background:white;padding:6px 8px;font:12px sans-serif}</style>
</head><body><div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([47.0707,15.4395],12);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
let previousLayer=L.layerGroup().addTo(map);let generatedLayer=L.layerGroup().addTo(map);let marker=null;
map.on('click',e=>{setStart(e.latlng.lat,e.latlng.lng);if(window.Android)Android.onMapClick(e.latlng.lat,e.latlng.lng);});
function setStart(lat,lon){if(marker)map.removeLayer(marker);marker=L.circleMarker([lat,lon],{radius:7,color:'#087f23',fillColor:'#17a744',fillOpacity:1}).addTo(map);}
function setPreviousTracks(json){previousLayer.clearLayers();const tracks=JSON.parse(json);tracks.forEach(t=>L.polyline(t,{color:'#687386',weight:2,opacity:.6}).addTo(previousLayer));fitAll();}
function setGeneratedTrack(json){generatedLayer.clearLayers();const t=JSON.parse(json);if(t.length){L.polyline(t,{color:'white',weight:7,opacity:.9}).addTo(generatedLayer);L.polyline(t,{color:'#d51f26',weight:4,opacity:1}).addTo(generatedLayer);}fitAll();}
function fitAll(){const layers=[];previousLayer.eachLayer(l=>layers.push(l));generatedLayer.eachLayer(l=>layers.push(l));if(layers.length){const g=L.featureGroup(layers);const b=g.getBounds();if(b.isValid())map.fitBounds(b,{padding:[15,15]});}}
</script></body></html>
