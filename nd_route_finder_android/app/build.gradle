plugins {
    id 'com.android.application'
}

android {
    namespace 'com.noondreams.ndroutefinder'
    compileSdk 35

    defaultConfig {
        applicationId 'com.noondreams.ndroutefinder'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
